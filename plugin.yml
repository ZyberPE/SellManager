name: SellManager
main: SellManager\Main
version: 1.0.0
api: 5.0.0
author: ZyberPE
depend: [EconomyAPI]

commands:
  sellhand:
    description: Sell the item in your hand
    usage: "/sellhand"
    permission: sellmanager.sellhand

  sellall:
    description: Sell all sellable items in your inventory
    usage: "/sellall"
    permission: sellmanager.sellall

  blockprices:
    description: Show sell prices
    usage: "/blockprices"
    permission: sellmanager.blockprices

permissions:
  sellmanager.sellhand:
    default: op

  sellmanager.sellall:
    default: op

  sellmanager.blockprices:
    default: op

  sell.rank:
    default: op
